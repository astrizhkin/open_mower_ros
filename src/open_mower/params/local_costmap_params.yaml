local_costmap:
  #global_frame: odom
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 5.0
  publish_frequency: 2.0
  rolling_window: true
  width: 5
  height: 5
  resolution: 0.05
  #static_map: false
  static_map: true
  #transform_tolerance: 1???
  #observation_persistence: 0.0???
  map_topic: mower_map_service/map
  plugins:
#uncomment to see in local map global bounds    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
#    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
#
#      Note: the ultrasonic range_sensor_layer is NOT a plugin here on purpose —
#      US occupancy runs in the standalone uss_costmap node (see
#      _move_base.launch / uss_costmap_params.yaml) so it never reaches the
#      planner's local costmap.
#    - {name: uss_layer, type: "range_sensor_layer::RangeSensorLayer"}
    - {name: contact_layer, type: "contact_sensor_layer::ContactSensorLayer"}
#    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  

